name: Deploy Web Viewer (Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/xtopen-core/**"
      - "crates/xtopen-web-wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build xtopen-web-wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown -p xtopen-web-wasm
          cp target/wasm32-unknown-unknown/release/xtopen_web_wasm.wasm docs/xtopen_web.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
