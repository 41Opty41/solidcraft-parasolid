name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools & SolidCraft CLI 0.50.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tools /tmp/dist
          gh release download -R bytecodealliance/wasm-tools -p "*x86_64-linux.tar.gz" -D /tmp/tools
          tar -xzf /tmp/tools/*wasm-tools*linux*.tar.gz -C /tmp/tools
          WASM_TOOLS=$(find /tmp/tools -name wasm-tools -type f | head -n 1)
          echo "WASM_TOOLS=$WASM_TOOLS" >> "$GITHUB_ENV"

          gh release download v0.50.0 -R tangency-labs/solidcraft -p "solidcraft-0.50.0-linux-x86_64.tar.gz" -D /tmp/tools
          mkdir -p /tmp/tools/sc
          tar -xzf /tmp/tools/solidcraft-0.50.0-linux-x86_64.tar.gz -C /tmp/tools/sc
          SC_CLI=$(find /tmp/tools/sc -name solidcraft-cli -type f | head -n 1)
          chmod +x "$SC_CLI"
          echo "SC_CLI=$SC_CLI" >> "$GITHUB_ENV"

      - name: Test, build components, verify and package zips
        run: |
          cargo test --workspace
          cargo build --release --target wasm32-unknown-unknown -p solidcraft-parasolid-wasm
          cargo build --release --target wasm32-unknown-unknown -p solidcraft-parasolid-export-wasm
          "$WASM_TOOLS" component new target/wasm32-unknown-unknown/release/solidcraft_parasolid_wasm.wasm -o solidcraft-parasolid/solidcraft-parasolid.wasm
          "$WASM_TOOLS" component new target/wasm32-unknown-unknown/release/solidcraft_parasolid_export_wasm.wasm -o solidcraft-parasolid-export/solidcraft-parasolid-export.wasm

          "$SC_CLI" plugin check solidcraft-parasolid
          "$SC_CLI" plugin test solidcraft-parasolid --require-cases
          "$SC_CLI" plugin check solidcraft-parasolid-export
          "$SC_CLI" plugin test solidcraft-parasolid-export --require-cases

          VER="${GITHUB_REF_NAME#v}"
          IMP_ZIP="solidcraft-parasolid-${VER}.zip"
          EXP_ZIP="solidcraft-parasolid-export-0.1.0.zip"
          (cd solidcraft-parasolid && zip -r "/tmp/dist/${IMP_ZIP}" plugin.json solidcraft-parasolid.wasm)
          (cd solidcraft-parasolid-export && zip -r "/tmp/dist/${EXP_ZIP}" plugin.json solidcraft-parasolid-export.wasm)
          "$SC_CLI" plugin check "/tmp/dist/${IMP_ZIP}"
          "$SC_CLI" plugin check "/tmp/dist/${EXP_ZIP}"
          (cd /tmp/dist && sha256sum "${IMP_ZIP}" "${EXP_ZIP}" > SHA256SUMS.txt)
          echo "IMP_ZIP_PATH=/tmp/dist/${IMP_ZIP}" >> "$GITHUB_ENV"
          echo "EXP_ZIP_PATH=/tmp/dist/${EXP_ZIP}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IMP_ZIP_PATH }}
            ${{ env.EXP_ZIP_PATH }}
            /tmp/dist/SHA256SUMS.txt
          generate_release_notes: true
